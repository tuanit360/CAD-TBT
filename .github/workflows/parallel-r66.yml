name: CAD360 R67 Unified Single App CI

on:
  workflow_dispatch:
  pull_request:
    branches: [integration/cad360-unified-r67]
    paths:
      - 'SOURCE_CAD_R65/**'
      - 'installer/**'
      - '.github/workflows/parallel-r66.yml'
  push:
    branches:
      - 'integration/cad360-unified-r67'
    paths:
      - 'SOURCE_CAD_R65/**'
      - 'installer/**'
      - '.github/workflows/parallel-r66.yml'

concurrency:
  group: cad360-r67-unified-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lane-1-core:
    name: "1 - Core compile"
    runs-on: windows-latest
    defaults:
      run:
        working-directory: SOURCE_CAD_R65
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: SOURCE_CAD_R65
      - run: cargo metadata --locked --no-deps --format-version 1 > $null
      - run: cargo check --locked -p cadcraft-engine -p cadcraft-doc -p cadcraft-render

  lane-2-io-xref:
    name: "2 - IO and XREF"
    runs-on: windows-latest
    defaults:
      run:
        working-directory: SOURCE_CAD_R65
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: SOURCE_CAD_R65
      - run: cargo test --locked -p cadcraft-engine --test xref -- --nocapture
      - run: cargo test --locked -p cadcraft-io --test it -- --nocapture

  lane-3-ui:
    name: "3 - UI and Vietnamese"
    runs-on: windows-latest
    defaults:
      run:
        working-directory: SOURCE_CAD_R65
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: SOURCE_CAD_R65
      - run: cargo test --locked -p cadcraft-ui-egui menus::tests -- --nocapture
      - run: cargo test --locked -p cadcraft-ui-egui layers::tests -- --nocapture
      - run: cargo test --locked -p cadcraft-ui-egui palettes::tests -- --nocapture
      - run: cargo test --locked -p cadcraft-ui-egui i18n::tests -- --nocapture
      - name: Verify product title
        shell: pwsh
        run: |
          $main = Get-Content "apps/cadcraft/src/main.rs" -Raw
          if ($main -notmatch "CAD 360 Việt Nam - TBT") { throw "CAD360 product title missing" }
      - name: Verify one unified CAD + BIM + QTO application
        shell: pwsh
        run: |
          $main = Get-Content "apps/cadcraft/src/main.rs" -Raw
          foreach ($module in @("mod takeoff;", "mod bim_collab;", "mod bim_clash;", "mod bim_federation;", "mod bim_coordinates;", "mod bim_workset;")) {
            if (!$main.Contains($module)) { throw "R67 module missing from single entrypoint: $module" }
          }
          foreach ($tab in @("MainTab::Cad", "MainTab::Takeoff", "MainTab::Pdf", "MainTab::Model3d", "MainTab::BimCollab")) {
            if (!$main.Contains($tab)) { throw "R67 unified navigation missing: $tab" }
          }
          if (!(Test-Path "apps/cadcraft/src/takeoff.rs") -or !(Test-Path "apps/cadcraft/src/bim_collab.rs")) { throw "CAD/BIM/QTO entrypoint files missing" }
          Write-Host "R67 CAD/BIM/QTO single-entrypoint source gate passed"

  lane-4-qto-bim:
    name: "4 - QTO and BIM"
    runs-on: windows-latest
    defaults:
      run:
        working-directory: SOURCE_CAD_R65
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: SOURCE_CAD_R65
      - run: cargo test --locked -p cadcraft takeoff::tests -- --nocapture
      - run: cargo test --locked -p cadcraft bim_ -- --nocapture
      - run: cargo test --locked -p cadcraft-engine bim_ -- --nocapture

  lane-5-regression:
    name: "5 - Engine regression"
    runs-on: windows-latest
    defaults:
      run:
        working-directory: SOURCE_CAD_R65
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: SOURCE_CAD_R65
      - run: cargo test --locked -p cadcraft-engine --test undo_control -- --nocapture
      - run: cargo test --locked -p cadcraft-engine clipboard -- --nocapture
      - run: cargo test --locked -p cadcraft-engine assoc_array -- --nocapture

  lane-6-workspace:
    name: "6 - Full workspace"
    runs-on: windows-latest
    defaults:
      run:
        working-directory: SOURCE_CAD_R65
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: SOURCE_CAD_R65
      - run: cargo check --workspace --locked
      - run: cargo test --workspace --locked --no-fail-fast

  portable:
    name: "7 - Portable Windows x64"
    needs: [lane-1-core, lane-2-io-xref, lane-3-ui, lane-4-qto-bim, lane-5-regression, lane-6-workspace]
    runs-on: windows-latest
    defaults:
      run:
        working-directory: SOURCE_CAD_R65
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: SOURCE_CAD_R65
      - name: Build release
        run: cargo build --release --locked -p cadcraft -p cadcraft-cli --target x86_64-pc-windows-msvc
      - name: Assemble portable package
        shell: pwsh
        working-directory: .
        run: |
          $bin = "SOURCE_CAD_R65/target/x86_64-pc-windows-msvc/release"
          $out = "portable/CAD360_VietNam_TBT_Win64"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item "$bin/cadcraft.exe" "$out/CAD360.exe"
          Copy-Item "$bin/cadcraft-cli.exe" "$out/cadcraft-cli.exe"
          & "$out/cadcraft-cli.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "CLI smoke test failed" }
          foreach ($name in @("CAD360.exe", "cadcraft-cli.exe")) {
            $exe = Join-Path $out $name
            $bytes = [IO.File]::ReadAllBytes((Resolve-Path $exe))
            if ($bytes.Length -lt 100000 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "Invalid Windows PE: $name" }
            $offset = [BitConverter]::ToInt32($bytes, 0x3C)
            if ([BitConverter]::ToUInt32($bytes, $offset) -ne 0x4550 -or [BitConverter]::ToUInt16($bytes, $offset + 4) -ne 0x8664) { throw "Invalid x64 architecture: $name" }
          }
          Get-ChildItem $out -Filter "*.exe" | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $($_.Name)" } | Set-Content "$out/SHA256SUMS.txt"
          "CAD360 Viet Nam - TBT Portable x64. Run CAD360.exe." | Set-Content "$out/README.txt" -Encoding UTF8
          Compress-Archive -Path "$out/*" -DestinationPath "portable/CAD360_VietNam_TBT_Portable_Win64.zip" -CompressionLevel Optimal -Force
      - uses: actions/upload-artifact@v4
        with:
          name: CAD360_VietNam_TBT_Portable_Win64
          path: portable/CAD360_VietNam_TBT_Portable_Win64.zip
          if-no-files-found: error
      - name: Compile the same CAD360 binary into Windows installer
        shell: pwsh
        working-directory: .
        run: |
          $src = "SOURCE_CAD_R65/target/x86_64-pc-windows-msvc/release"
          $dst = "SOURCE_CAD_R65/target/release"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item "$src/cadcraft.exe" "$dst/cadcraft.exe" -Force
          Copy-Item "$src/cadcraft-cli.exe" "$dst/cadcraft-cli.exe" -Force
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6/ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
          }
          if (!(Test-Path $iscc)) { throw "ISCC.exe not found" }
          & $iscc "/Qp" "installer/TBT360_CAD_R65.iss"
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed" }
          if (!(Test-Path "dist/CAD360_VietNam_TBT_Setup.exe")) { throw "Setup EXE was not generated" }
          Get-FileHash "dist/CAD360_VietNam_TBT_Setup.exe" -Algorithm SHA256
      - name: Smoke test Windows installer and uninstall
        shell: pwsh
        working-directory: .
        run: |
          $ErrorActionPreference = "Stop"
          $setup = (Resolve-Path "dist/CAD360_VietNam_TBT_Setup.exe").Path
          $install = Join-Path $env:RUNNER_TEMP "CAD360_R67_Smoke"
          $p = Start-Process -FilePath $setup -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=$install") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Install failed: $($p.ExitCode)" }
          $app = Join-Path $install "cadcraft.exe"
          $uninstaller = Join-Path $install "unins000.exe"
          if (!(Test-Path $app) -or !(Test-Path $uninstaller)) { throw "Installed EXE/uninstaller missing" }
          $gui = Start-Process -FilePath $app -PassThru
          Start-Sleep -Seconds 7
          $gui.Refresh()
          if ($gui.HasExited) { throw "GUI quit immediately with code $($gui.ExitCode)" }
          Stop-Process -Id $gui.Id -Force
          $p = Start-Process -FilePath $uninstaller -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Uninstall failed: $($p.ExitCode)" }
          if (Test-Path $app) { throw "Executable remained after uninstall" }
          Write-Host "R67 install, GUI launch and uninstall smoke passed"
      - uses: actions/upload-artifact@v4
        with:
          name: CAD360_R67_Windows_Setup_EXE
          path: dist/CAD360_VietNam_TBT_Setup.exe
          if-no-files-found: error
