name: TBT360 CAD R65 Windows Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'SOURCE_CAD_R65/**'
      - '.github/workflows/main.yml'

concurrency:
  group: cad-r65-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: SOURCE_CAD_R65

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Check Rust version
        run: |
          rustc --version
          cargo --version

      - name: Cache Rust dependencies and build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: SOURCE_CAD_R65

      - name: Verify CADCraft updater is absent from TBT360 runtime
        shell: pwsh
        run: |
          $hits = git grep -n -E "craft_update|craft-update|suite::CADCRAFT" -- apps/cadcraft/src crates/ui-egui/src apps/cadcraft/Cargo.toml crates/ui-egui/Cargo.toml Cargo.toml
          if ($LASTEXITCODE -eq 0 -and $hits) {
            $hits | Write-Host
            throw "Upstream CADCraft updater code is still referenced by the TBT360 runtime"
          }

      - name: Check CAD workspace
        run: cargo check --workspace --locked

      - name: Test CAD menus and command dispatch
        run: cargo test --locked -p cadcraft-ui-egui menus::tests -- --nocapture

      - name: Test Vietnamese interface catalog
        run: cargo test --locked -p cadcraft-ui-egui i18n::tests -- --nocapture

      - name: Test native Takeoff
        run: cargo test --locked -p cadcraft takeoff::tests -- --nocapture

      - name: Test complete CAD workspace
        run: cargo test --workspace --locked --no-fail-fast

      - name: Build CAD R65
        run: cargo build --release --locked -p cadcraft -p cadcraft-cli

      - name: Verify native Windows binaries
        shell: pwsh
        run: |
          foreach ($name in @("cadcraft.exe", "cadcraft-cli.exe")) {
            $path = "target/release/$name"
            if (!(Test-Path $path)) { throw "Missing compiled R65 binary: $path" }
            $file = Get-Item $path
            if ($file.Length -lt 100000) { throw "Unexpectedly small compiled binary: $path" }
          }
          & "./target/release/cadcraft-cli.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "R65 CLI smoke test failed" }

      - name: Install Inno Setup compiler
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6/ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
          }
          if (!(Test-Path $iscc)) { throw "ISCC.exe not found after installation" }

      - name: Build Windows Setup EXE
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6/ISCC.exe"
          & $iscc "/Qp" "../installer/TBT360_CAD_R65.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compile failed" }
          if (!(Test-Path "../dist/CAD360_VietNam_TBT_Setup.exe")) { throw "Setup EXE not created" }

      - name: Upload Windows Setup
        uses: actions/upload-artifact@v4
        with:
          name: CAD360_VietNam_TBT_Windows_Setup
          path: dist/CAD360_VietNam_TBT_Setup.exe
          if-no-files-found: error
